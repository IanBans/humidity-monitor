[env:seeed_xiao_esp32c6]
platform =https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-c6
framework = arduino
; The Seeed platform requires its ESP-IDF 5.3-compatible esptool (v5.1.2).
; Pin it so PlatformIO does not reuse the incompatible global v4 package.
platform_packages =
  tool-esptoolpy@https://files.seeedstudio.com/arduino/platformio/esptoolpy-v5.1.2.zip
lib_deps =
  adafruit/Adafruit AHTX0 @ ^2.0.5
monitor_speed = 115200
